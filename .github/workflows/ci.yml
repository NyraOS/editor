# SPDX-License-Identifier: MIT
# Format, lints and tests (on stable Rust and on 1.85, the oldest we support: Debian 13's), the
# comparison tests against GNU nano 8.4, licences and advisories of the locked dependencies, and a
# scan for secrets.
# Every push to any branch runs it once; pull_request runs only for pull requests from forks, whose
# pushes do not run here. Weekly as well, so new advisories show up without a code change.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 test --locked

  # The safe-saving tests (src/files) as root, in a privileged container: bind mounts, a full file
  # system, files of other users, and each test again as an ordinary user. The rust job above runs
  # them as the runner's ordinary user. The test binary is built here and run in Debian 13.
  files-root:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the tests
        run: |
          bin=$(cargo test --locked --bin nyra-editor --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable')
          mkdir "$RUNNER_TEMP/t"
          cp "$bin" "$RUNNER_TEMP/t/files-tests"
          chmod 755 "$RUNNER_TEMP/t" "$RUNNER_TEMP/t/files-tests"
      # debian:trixie-slim, pinned by its multi-arch index digest, from Google's mirror of Docker
      # Hub (no pull limits per runner IP).
      - name: Run them as root in a container
        run: >-
          docker run --rm --privileged -v "$RUNNER_TEMP/t:/t:ro"
          mirror.gcr.io/library/debian@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
          /t/files-tests files:: --nocapture

  # The comparison tests (tests/compare) against GNU nano 8.4, built by tools/build-nano.sh from
  # the GNU tarball pinned by its SHA-256 and cached; with $NANO set, they fail on any other version.
  # They run twice: GNU nano as the editor under test, then the editor itself.
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nano
        with:
          path: ~/nano-8.4
          key: nano-8.4-ubuntu-24.04-${{ hashFiles('tools/build-nano.sh') }}
      - name: Build GNU nano 8.4
        if: steps.nano.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libncurses-dev
          tools/build-nano.sh ~/nano-8.4
      # First GNU nano against itself, which checks the scenarios and the harness; then the
      # editor against GNU nano, in every scenario that has no `pending:` line.
      - name: Scenarios and harness, on GNU nano
        run: NANO="$HOME/nano-8.4/bin/nano" cargo test --locked --test compare -- --nocapture
      - run: cargo build --locked --features test-sysconfdir
      - name: The editor against GNU nano
        run: >-
          NANO="$HOME/nano-8.4/bin/nano" COMPARE_EDITOR=target/debug/nyra-editor
          cargo test --locked --features test-sysconfdir --test compare scenarios -- --nocapture

  deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # Runs the gitleaks container directly: the gitleaks GitHub Action needs a licence for organizations.
  gitleaks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks v8.30.1, pinned by its multi-arch index digest, from GitHub's registry (Docker Hub
      # limits unauthenticated pulls per runner IP).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner -v /repo
