# SPDX-License-Identifier: MIT
[package]
name = "nyra-editor"
version = "0.1.0"
edition = "2024"
# The Rust in Debian 13 (trixie).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NyraOS/editor"
description = "A nano-compatible terminal editor written from scratch in Rust"

[dependencies]
# The text: a rope, with only "\n" as a line break (the default features add the Unicode ones).
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
# The terminal (raw mode, its size, waiting for keys or a resize) and the system calls of the
# files module (reading, safe saving, locks, backups), without unsafe code.
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "rand", "system", "termios"] }
# SIGWINCH through a pipe; SIGHUP and SIGTERM set a flag, so the editor writes its emergency
# copies (0.3: the version crossterm uses).
signal-hook = { version = "=0.3.18", default-features = false }
# Regular expressions (M-R in the search prompts): the extended POSIX ones of nano are translated
# to it, see docs/REGEX.md. Only what that needs: Unicode case and classes, no performance extras.
regex = { version = "=1.11.1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "unicode-gencat", "unicode-bool"] }
# How many columns a character takes on the screen.
unicode-width = { version = "=0.2.2", default-features = false }

[dev-dependencies]
# The comparison tests (tests/compare): rustix opens the pseudo-terminal, vt100 is the terminal emulator.
# The files tests mount small file systems and bind mounts when run as root.
rustix = { version = "1.1.5", features = ["event", "mount", "pty", "termios"] }
vt100 = "0.18.1"

[[test]]
name = "compare"
path = "tests/compare/main.rs"

[profile.release]
# A small binary: the editor is in every image.
lto = true
codegen-units = 1
strip = true
